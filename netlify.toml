# Production secrets are synced from Infisical prod:/ to this site's
# production context. Keep secrets out of this file: Functions receive them
# from Netlify's environment. Redeploy after changing synced secrets.
[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22.23.2"
  PNPM_VERSION = "11.7.0"

[dev]
  command = "pnpm dev"
  targetPort = 3000
